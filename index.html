<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khan Agro Farm: Loan Application</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* CONFIG BLOCK: colors, timing, sizes. Edit values here. */
:root{--bg:#f6f4ee;--fg:#1d2a22;--mut:#5d6b62;--card:#fff;--ac:#1f7a4d;--ac2:#c98a0a;--bd:#e3dfd2;--warn:#b4532a;--shadow:0 8px 24px rgba(20,40,28,.08);
--nav:68px;--dur:.55s;--stagger:90ms;--dist:18px;--radius:18px;--pad:22px;--maxw:1040px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--fg:#eef3ee;--mut:#9db0a3;--card:#18271e;--ac:#4fc58a;--ac2:#f0bf4a;--bd:#2a3d31;--warn:#e68a5c;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a14;--fg:#eef3ee;--mut:#9db0a3;--card:#18271e;--ac:#4fc58a;--ac2:#f0bf4a;--bd:#2a3d31;--warn:#e68a5c;--shadow:0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:"Hind Siliguri","Noto Sans Bengali","Segoe UI",sans-serif;font-size:18px;line-height:1.6;overflow:hidden;text-align:center}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--ac) 18%,transparent),transparent),radial-gradient(700px 400px at -10% 110%,color-mix(in srgb,var(--ac2) 16%,transparent),transparent);pointer-events:none}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:4px;background:linear-gradient(90deg,var(--ac),var(--ac2));width:0;transition:width var(--dur) ease;z-index:5}
#deck{position:fixed;inset:0}
.s{position:absolute;inset:env(safe-area-inset-top,0px) 0 calc(var(--nav) + env(safe-area-inset-bottom,0px)) 0;overflow-y:auto;display:flex;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity var(--dur) ease,transform var(--dur) ease,visibility 0s var(--dur);padding:28px 20px 40px}
.s.on{opacity:1;visibility:visible;transform:none;transition:opacity var(--dur) ease,transform var(--dur) ease}
.w{max-width:var(--maxw);width:100%;margin:auto}
.k{display:inline-block;color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);font-weight:700;letter-spacing:.04em;margin:0 0 10px;font-size:14px;padding:4px 14px;border-radius:999px}
h2{font-size:clamp(26px,4.4vw,44px);line-height:1.25;margin:0 0 6px}
h2::after{content:"";display:block;width:64px;height:4px;border-radius:4px;background:var(--ac2);margin:14px auto 6px}
.lead{font-size:clamp(19px,2.4vw,24px);color:var(--mut);margin:12px 0 10px}
.meta{color:var(--mut);font-size:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:18px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:var(--radius);padding:var(--pad);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px}
.c h3{margin:6px 0 0;font-size:19px}.c p{margin:0;color:var(--mut);font-size:16px;line-height:1.55}
.ic{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.ic svg{width:26px;height:26px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:22px 0}.row .ic{width:60px;height:60px}.row .ic svg{width:32px;height:32px}
.tw{overflow-x:auto;margin-top:18px;border-radius:var(--radius);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:560px;background:var(--card)}
th,td{padding:14px;text-align:center;border-bottom:1px solid var(--bd);font-size:16px}
th{background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac)}
td.v{font-weight:700;font-size:18px}
.n{margin:18px auto 0;max-width:820px;padding:14px 18px;border:1px solid color-mix(in srgb,var(--ac2) 45%,transparent);background:color-mix(in srgb,var(--ac2) 10%,transparent);border-radius:12px;font-size:15px;color:var(--mut)}
.tl{list-style:none;margin:18px auto 0;padding:0 0 0 16px;max-width:560px;text-align:left}
.tl li{padding:2px 0 14px 18px;position:relative}.tl li::before{content:"";position:absolute;left:-12px;top:9px;width:15px;height:15px;border-radius:50%;background:var(--ac)}.tl li:not(:last-child)::after{content:"";position:absolute;left:-6px;top:24px;bottom:-9px;width:3px;background:var(--ac)}
.tl b{color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--bd)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:8px 18px;min-height:44px;min-width:44px}
button:hover{border-color:var(--ac)}
button:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
#ct{min-width:80px;text-align:center;color:var(--mut)}
.a{opacity:0}
.s.on .a{animation:up var(--dur) ease both;animation-delay:calc(var(--i,0) * var(--stagger))}
@keyframes up{from{opacity:0;transform:translateY(var(--dist))}to{opacity:1;transform:none}}
@media (hover:hover){.c{transition:transform .25s ease,border-color .25s ease}.c:hover{transform:translateY(-4px);border-color:var(--ac)}}
@media (prefers-reduced-motion:reduce){.s,.s.on,#bar{transition:none}.s.on .a{animation:none;opacity:1}.c{transition:none}}
</style>
</head>
<body>
<div id="bar"></div>
<main id="deck" aria-live="polite"></main>
<nav aria-label="Slide navigation">
<button id="pv" aria-label="আগের slide">&larr;</button><span id="ct"></span><button id="nx" aria-label="পরের slide">&rarr;</button>
</nav>
<script>

const P={

const ic=n=>`<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n].split("|").map(d=>`<path d="${d}"/>`).join("")}</svg></span>`;
const card=(i,h,t,n)=>`<div class="c a" style="--i:${n+2}">${ic(i)}<h3>${h}</h3><p>${t}</p></div>`;

// Slide content: [kicker, title, html]
const S=[
["Bank Loan Application","Khan Agro Farm",
`<p class="lead a" style="--i:2">সমন্বিত খামার ও খাদ্য কোম্পানি। Phase-ভিত্তিক বিকাশ পরিকল্পনা, শুরু Contract Poultry দিয়ে।</p><div class="row a" style="--i:3">${ic("bird")}${ic("cow")}${ic("leaf")}${ic("fish")}${ic("flame")}</div><p class="meta a" style="--i:4">উদ্যোক্তা: আরিফুল ইসলাম | ব্যাংক: এখনো নির্ধারিত হয়নি</p>`],
["মিশন ও ভিশন","আমরা কোথায় যেতে চাই",

note("রপ্তানির লক্ষ্য ৭ বছরের মধ্যে, সর্বোচ্চ সময়সীমা ২০৩৭। Loan-এর ভিত্তি Phase 1-এর আয়।",7)],
["ব্যবসার মডেল","একটির বর্জ্য আরেকটির সম্পদ",

["বাজার","বাজার ও মানুষের চাহিদা",

note("ধরা হয়েছে: প্রতি ১০০০ চিকে প্রায় ১,৮৫০ kg বিক্রয়যোগ্য ওজন (অনুমান), বছরে ৯ Batch, Electricity ও Litter ২০০০ মুরগিতে প্রতি Batch-এ ৭,৫০০ টাকা, Permanent শ্রমিক গড়ে ১৩,৫০০ ও Contractual ২,০০০ টাকা মাসে। সর্বনিম্ন ১৬ টাকা/kg উদ্যোক্তার নিশ্চিত তথ্য, লিখিত চুক্তি সংযুক্ত হবে। পরিবারের খরচ ও EMI বাদ।",3)],
["Phase 2-3","গরু, Sonali, মাছ ও কৃষি",

const deck=document.getElementById("deck"),ct=document.getElementById("ct"),bar=document.getElementById("bar"),pv=document.getElementById("pv"),nx=document.getElementById("nx");
deck.innerHTML=S.map((s,i)=>`<section class="s" id="s${i+1}" aria-label="${s[1]}"><div class="w"><p class="k a">${s[0]}</p><h2 class="a" style="--i:1">${s[1]}</h2>${s[2]}</div></section>`).join("");
const slides=[...deck.children];
const bn=n=>n.toLocaleString("bn-BD");
let cur=-1;
function go(n,push){
  n=Math.max(0,Math.min(slides.length-1,n));
  if(n===cur)return;
  cur=n;
  slides.forEach((s,i)=>{s.classList.toggle("on",i===n);s.scrollTop=0});
  ct.textContent=bn(n+1)+" / "+bn(slides.length);
  bar.style.width=((n+1)/slides.length*100)+"%";
  pv.disabled=n===0;nx.disabled=n===slides.length-1;
  if(push){try{history.replaceState(null,"","#s"+(n+1))}catch(e){}}
}
const fromHash=()=>{const m=/^#s(\d+)$/.exec(location.hash);return m?parseInt(m[1],10)-1:0};
pv.onclick=()=>go(cur-1,true);nx.onclick=()=>go(cur+1,true);
addEventListener("keydown",e=>{
  if(["ArrowRight","PageDown"," "].includes(e.key)){e.preventDefault();go(cur+1,true)}
  else if(["ArrowLeft","PageUp"].includes(e.key)){go(cur-1,true)}
  else if(e.key==="Home"){go(0,true)}else if(e.key==="End"){go(slides.length-1,true)}
});
let x0=null;
deck.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
deck.addEventListener("touchend",e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>60)go(cur+(d<0?1:-1),true);x0=null});
addEventListener("hashchange",()=>go(fromHash(),false));
go(fromHash(),false);
</script>
